[package]
name = "borderlands"
version = "0.1.0"
edition = "2024"
default-run = "borderlands"
authors = ["Bjarke Falch Sørensen <bs@wasd.dk>"]

[dependencies]
bevy = { version = "0.17.3", default-features = false, features = [
    "std",
    "async_executor",
    "bevy_asset",
    "bevy_camera",
    "bevy_color",
    "bevy_core_pipeline",
    "bevy_image",
    "bevy_render",
    "bevy_sprite",
    "bevy_sprite_render",
    "bevy_text",
    "bevy_ui",
    "bevy_ui_render",
    "bevy_window",
    "bevy_winit",
    "default_font",
    "multi_threaded",
    "png",
    "tonemapping_luts",
    "x11",
    "zstd_rust",
]}
